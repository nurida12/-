<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moana</title>
<link rel="stylesheet" href="flexbox2.css">

<style>

body{
    font-family: Arial;
    background-color: lightblue;
    text-align: center;
}

h1{
    color: darkblue;
    background-color: white;
}

.container{
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: row;
    flex-wrap:wrap-flex;
    gap: 20px;
}

.card{
    width: 220px;
    border: 2px solid blue;
    border-radius: 10px;
    background-color: white;
    padding: 10px;
}

.card img{
    width: 100%;
    height: 200px;
}

 (max-width:600px){
    .container{
        flex-direction: column;
    }
}

</style>

</head>

<body>

<h1>Moana мультфильмі</h1>

<p>Moana – Disney студиясының танымал мультфильмі.</p>

<div class="container">

<div class="card">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbUUKliUPGtQoZzyrSEBK1RFOYbJHrL_YZe085E5vKMQ&s=10" alt="Moana">
<h3>Моана</h3>

</div>

<div class="card">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfEBC1WOWT_cg1CxLmt-I8lGYbxuD2eh7Koh3UHYerjw&s=10" alt="Maui">
<h3>Мауи</h3>

</div>

<div class="card">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT67jequXOxVlD94tsWPyqAZ9g_b21m1-XRAf2Qq0acNg&s=10" alt="Heihei">
<h3>Хейхей</h3>

</div>

</div>

</body>
</html>
