<!DOCTYPE html>
<html>
<head>
    <title>JavaScript</title>

<script>
function add(a, b) {
    return a + b;
}

alert(add(5, 3));

function greet(name) {
    return "Hello, " + name;
}

alert(greet("Ali"));

function age5(age) {
    return age + 5;
}

alert(age5(15));

function check(number) {
    if (number % 2 == 0) {
        return "Жұп сан";
    } else {
        return "Тақ сан";
    }
}

alert(check(8));
alert(check(7));
</script>

</body>
</html>
