<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form.</title>
</head>

<body>
    <Fieldset>
        <legend>Жеке ақпарат(Сайысқа қатысу)</legend>
        <form>
            <label for="name">Аты-жөңініз:</label>
            <input type="text" id="name" name="name">
            <br>
            <br>
            <label for="email">Элeктронды почтаңыз:</label>
            <input type="email" name="email" id="email">
            <br>
            <br>
            <label for="password">Құпия сөз:</label>
            <input type="password" id="password" name="password">
            <br>
            <br>
            <label for="password">Құпия сөзді қайталаңыз:</label>
            <input type="password" id="password" name="password">
            <br>
            <br>
            <label for="age">Жасыңыз:</label>
            <input type="number" id="age" name="age" min="10" max="20">
            <br>
            <br>
            <label for="Туған күніңіз">Туған күніңіз:</label>
            <input type="date" id="birthday" name="birthday">
            <br>
            <br>
            <label for="male">ұл</label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="female">қыз</label>
            <input type="radio" name="gender" id="female" value="female">
            <br>
            <br>
            <label for="coutry">Қала:</label>
            <select name="coutry" id="coutry">
                <option value="ALA">Алматы</option>
                <option value="NQZ">Астана</option>
                <option value="KGF">Қарағанды</option>
                <option value="CIT">Шымкент</option>
                <option value="SCO">Ақтау</option>
                <option value="AKX">Ақтөбе</option>
                <option value="URA">Орал</option>
                <option value="GUW">Атрауы</option>
            </select>
            <br>
            <br>
            <label for="subscribe">Келісім шарттармен келісу:</label>
            <input type="checkbox" name="subscribe" id="subscribe">
            <br>
            <br>
            <button type="submit">Жіберу:</button>





        
        </form>


    </Fieldset>
</body>

</html>
